[project]
name = "freshdesk-connector"
version = "0.1.0"
description = "Read-only Freshdesk connector (MCP server) for agent platforms such as Razorpay Agent Studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
freshdesk-connector = "freshdesk_connector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freshdesk_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
